<!DOCTYPE html><html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Scooter Achtervolging</title>
<style>
:root{--bg:#f1f1f4;--fg:#15171d;--card:#fff;--ac:#e08a00;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14161c;--fg:#f2f2f2;--card:#222632;--ac:#ffb400}}
:root[data-theme="dark"]{--bg:#14161c;--fg:#f2f2f2;--card:#222632;--ac:#ffb400}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,Arial,sans-serif;display:flex;justify-content:center}
#app{width:100%;max-width:640px;padding:12px;text-align:center;box-sizing:border-box}
h1{margin:8px 0;font-size:26px}
.card{background:var(--card);border-radius:12px;padding:12px;margin:8px 0;display:flex;align-items:center;gap:10px;text-align:left}
.card .sw{width:34px;height:18px;border-radius:6px;flex:none}
.card div.i{flex:1}
button{background:var(--ac);color:#111;border:0;border-radius:10px;padding:12px 18px;font-size:16px;font-weight:700;cursor:pointer;margin:4px}
button:disabled{opacity:.45}
button.g{background:var(--card);color:var(--fg)}
canvas{width:100%;height:auto;border-radius:12px;touch-action:none;display:block}
#app{max-width:1500px!important}.lr{padding:4px;border-radius:6px;max-width:320px;margin:2px auto;text-align:left}.lr.me{background:var(--ac);color:#111;font-weight:700}
#br2{display:flex;gap:12px;margin-top:8px;align-items:center}#br2 button{flex:1;margin:0;padding:12px 6px}
.vs,.ve{width:75px;accent-color:var(--ac);vertical-align:middle;cursor:pointer}
.hide{display:none}
#hl,#sl{max-width:560px;margin:0 auto}
#fresh{position:fixed;left:10px;bottom:calc(10px + env(safe-area-inset-bottom,0px));z-index:9;font-size:13px;padding:8px 12px;margin:0;box-shadow:0 2px 8px rgba(0,0,0,.3)}
#fresh.w{background:#d32f2f;color:#fff}
#mb{display:grid;grid-template-columns:1fr 1fr;gap:8px;max-width:440px;margin:10px auto}#mb button{margin:0;width:100%}#mb #rb{grid-column:1/-1}
</style></head><body><div id="app">
<div id="menu"><h1>🛵 Scooter Achtervolging</h1>
<p>Punten: <b id="pts"></b> &nbsp; Resets: <b id="rs"></b><b id="x2"></b><br>Scooter: <b id="cur"></b></p>
<p style="font-size:14px;opacity:.85">♻ 3 resets = ×2 punten &nbsp;•&nbsp; 8 resets = ×3 punten</p>
<p><input id="nm" maxlength="12" placeholder="Typ je naam" oninput="setName(this.value)" style="padding:10px;font-size:16px;border-radius:10px;border:2px solid var(--ac);background:var(--card);color:var(--fg);text-align:center"></p>
<p>🎵 Muziek <input id="vol" type="range" min="0" max="100" class="vs" oninput="setvol(this.value)" onchange="blip()"> &nbsp; 🔧 Uitlaat <input id="evol" type="range" min="0" max="100" class="ve" oninput="setevol(this.value)" onchange="eblip()"></p>
<div id="mb"><button onclick="start()">▶ Start spel</button><button class="g" onclick="shop()">🛒 Shop</button><button class="g" onclick="codes()">🔑 Codes</button><button class="g" onclick="hist()">📜 Herhaling</button><button class="g" onclick="skins()">🎭 Skins</button><button class="g" onclick="music()">🎵 Muziek</button><button class="g" onclick="glows()">💡 Underglow</button><button class="g" onclick="exhausts()">🔧 Uitlaten</button><button class="g" id="rb" onclick="rst()">♻ Reset (2000 pt)</button></div>
<h2 style="margin:12px 0 4px">🏆 Leaderboard</h2><div id="lbm"></div><div style="height:60px"></div><button id="fresh" class="g" onclick="fresh()">🗑 Helemaal opnieuw</button></div>
<div id="codes" class="hide"><h1>🔑 Codes</h1><p><input id="ci" placeholder="Typ een code" style="padding:10px;font-size:16px;border-radius:10px;border:2px solid var(--ac);background:var(--card);color:var(--fg);text-align:center"></p><button onclick="redeem()">Inwisselen</button><p id="cm"></p><button class="g" onclick="menu()">← Terug</button></div>
<div id="hist" class="hide"><h1>📜 Herhaling</h1><button id="hb" class="g" onclick="hsort()"></button><div id="hl"></div><button class="g" onclick="menu()">← Terug</button></div>
<div id="skins" class="hide"><h1>🎭 Skins</h1><p>Punten: <b id="pts3"></b></p><div id="sl"></div><button class="g" onclick="menu()">← Terug</button></div>
<div id="exh" class="hide"><h1>🔧 Uitlaten</h1><p>Punten: <b id="pts6"></b></p><div id="el"></div><button class="g" onclick="menu()">← Terug</button></div>
<div id="glow" class="hide"><h1>💡 Underglow</h1><p>Punten: <b id="pts5"></b></p><div id="gl"></div><button class="g" onclick="menu()">← Terug</button></div>
<div id="music" class="hide"><h1>🎵 Muziek</h1><p>Punten: <b id="pts4"></b></p><div id="ml"></div><button class="g" onclick="menu()">← Terug</button></div>
<div id="shop" class="hide"><h1>🛒 Shop</h1><p>Punten: <b id="pts2"></b> &nbsp; Resets: <b id="rs2"></b></p><div id="list"></div><button class="g" onclick="menu()">← Terug</button></div>
<div id="game" class="hide"><canvas id="c" width="1400" height="600"></canvas>
<div id="br2">
  <div style="display:flex;flex-direction:column;align-items:flex-start;gap:3px;flex:none">
    <div style="display:flex;align-items:center;gap:6px">
      <span style="font-size:15px">🎵</span>
      <input class="vs" type="range" min="0" max="100" oninput="setvol(this.value)" onchange="blip()" style="flex:none">
    </div>
    <div style="display:flex;align-items:center;gap:6px">
      <span style="font-size:15px">🔧</span>
      <input class="ve" type="range" min="0" max="100" oninput="setevol(this.value)" onchange="eblip()" style="flex:none">
    </div>
    <div style="font-size:11px;font-weight:700;color:var(--fg);opacity:.85;line-height:1.25;text-align:left">
      Wheelie (E)<br>Boost (SPATIE)
    </div>
  </div>
  <button id="pb" class="g" onclick="pause()">⏸ Stop</button>
  <button class="g" onclick="quit()">🏠 Menu</button>
</div></div>
<div id="over" class="hide"><h1 id="ot"></h1><p id="od"></p><button onclick="start()">Opnieuw</button><button class="g" onclick="shop()">🛒 Shop</button><button class="g" onclick="menu()">Menu</button></div>
</div>
<script>
const S=[
  {id:'zip',m:1,n:'Zip',p:0,s:3.0,b:3,c:'#4fc3f7'},
  {id:'jog',m:1.1,n:'Jog',p:150,s:3.5,b:4.5,c:'#81c784'},
  {id:'booster',m:1.2,n:'Booster',p:350,s:4.0,b:6,c:'#ff8a65'},
  {id:'onewheel',m:1.3,n:'One Wheel',p:450,s:4.5,b:6,c:'#ff4081'},
  {id:'estep',m:1.4,n:'Elektrische step',p:500,s:5.0,b:7,c:'#00bfa5'},
  {id:'aerox',m:1.5,n:'Aerox',p:700,s:5.6,b:8,c:'#ba68c8'},
  {id:'crosser',m:1.6,n:'50cc Crosser',p:1200,s:6.2,b:9,c:'#ff5722'},
  {id:'rocket',m:1.7,n:'Rocket Racer',p:2500,s:6.9,b:11,c:'#2979ff'},
  {id:'porsche',m:1.8,n:'Porsche 911',p:5000,s:7.6,b:12,c:'#ffd600'},
  {id:'koets',m:1.5,n:'Koets',p:0,rs:1,s:3.2,b:4,c:'#7b1e1e'},
  {id:'straaljager',m:2,n:'Straaljager',p:0,rs:8,s:8.5,b:14,c:'#607d8b'},
  {id:'maiskolf',m:1.3,n:'Maiskolf-fiets',p:10,sec:1,s:4.5,b:6,c:'#fdd835'}
];
const DS=[
  'Piaggio Zip: Italiaanse 50cc stadsscooter, rond en compact.',
  'Yamaha Jog: lichte 50cc scooter, populair als eerste brommer.',
  'Yamaha/MBK Booster: sportieve 50cc met brede banden en rechte voorkant.',
  'One Wheel: elektrisch board met één dikke band; je balanceert erop.',
  'Elektrische step: opvouwbare e-step met stuur en kleine wieltjes.',
  'Yamaha Aerox: scherpe 50cc sportscooter met racelook.',
  'Crosser 50cc: kleine offroad dirtbike met noppenbanden.',
  'Rocket Racer: raketaangedreven racewagen (verzonnen naam).',
  'Porsche 911: Duitse sportwagen met de motor achterin, sinds 1964.',
  'Koets: paardenkoets met koetsier, de oude manier van reizen.',
  'Straaljager: militair gevechtsvliegtuig met naverbranders en raketten.',
  'Geheim! Een maiskolf als fiets. Even snel als de One Wheel.'
];
const W=1400,H=600,HZ=330,CC=['#e53935','#fdd835','#43a047','#fb8c00','#8e24aa','#eceff1','#26a69a'];
const L=[{n:'Politie',e:2.04},{n:'Leger',e:2.4},{n:'Aliens',e:2.76},{n:'Donald Trump',e:3.12},{n:'Straaljagers',e:3.48}];
const LY=i=>i<2?365+i*50:515+(i-2)*50,SC=y=>.92+(y-365)/200*.45;
const TIP=[[-39,-12],[-39,-12],[-40,-16],[-24,-20],[-28,-11],[-38,-21],[-44,-29],[-46,-18],[-47,-16],[-30,-30],[-46,-24],[-40,-22]];
let st={pts:0,own:[0],sel:0,v:7};
try{
  const j=localStorage.getItem('sa');
  if(j){
    st=JSON.parse(j);
    if(!st.v||st.v<7){
      const M=[0,1,2,5,6,7,8,9,4,3];
      if(Array.isArray(st.own))st.own=[...new Set(st.own.map(i=>M[i]??i))];
      if(st.sel!=null&&M[st.sel]!=null)st.sel=M[st.sel];
      st.v=7;
      save();
    }
  }
}catch(e){}
function save(){try{localStorage.setItem('sa',JSON.stringify(st))}catch(e){}}
const $=id=>document.getElementById(id),cv=$('c'),x=cv.getContext('2d');
function show(id){['menu','shop','skins','hist','codes','music','glow','exh','game','over'].forEach(i=>$(i).classList.toggle('hide',i!=id))}
function menu(){g.run=false;musicOff();$('pts').textContent=st.pts;$('rs').textContent=st.rs||0;$('x2').textContent=MU()>1?' ✨ ×'+MU()+' punten!':'';$('rb').textContent='♻ Reset (2000 pt)';$('cur').textContent=S[st.sel].n;$('nm').value=st.name||'';document.querySelectorAll('.vs').forEach(e=>e.value=vol()*100);document.querySelectorAll('.ve').forEach(e=>e.value=ve()*100);rlb();show('menu')}
function shop(){g.run=false;$('pts2').textContent=st.pts;$('rs2').textContent=st.rs||0;$('list').innerHTML=S.map((s,i)=>{const o=st.own.includes(i);if(s.sec&&!o&&!(st.codes||[]).includes('iedeislekker'))return '';
return `<div class="card"><div class="sw" style="background:${s.c}"></div><div class="i"><b>${s.n}</b><br><small>${DS[i]}<br>Snelheid: ${'★'.repeat(Math.min(5,Math.max(1,Math.round(s.s/1.8))))} &nbsp; ⚡ Boost: ${s.b} sec per level &nbsp; 💰 Punten: ×${s.m}</small></div>`+
(o?`<button onclick="pick(${i})" ${st.sel==i?'disabled':''}>${st.sel==i?'Gekozen':'Kies'}</button>`:`<button onclick="buy(${i})" ${(s.rs?(st.rs||0)<s.rs:st.pts<s.p)?'disabled':''}>${s.rs?s.rs+(s.rs>1?' resets':' reset'):s.p+' pt'}</button>`)+'</div>'}).join('');show('shop')}
function buy(i){const q=S[i];if(q.rs?(st.rs||0)>=q.rs:st.pts>=q.p){if(q.rs)st.rs-=q.rs;else st.pts-=q.p;st.own.push(i);st.sel=i;save();shop()}}
function rst(){const b=$('rb');if(st.pts<2000){b.textContent='❌ Je hebt 2000 punten nodig';setTimeout(()=>b.textContent='♻ Reset (2000 pt)',2200);return}
if(!b.dataset.s){b.dataset.s=1;b.textContent='⚠ Alles weg! Klik nogmaals';setTimeout(()=>{delete b.dataset.s;b.textContent='♻ Reset (2000 pt)'},4000);return}
st.pts=0;st.own=[0];st.sel=0;st.sk=[0];st.skin=0;st.ms=[0];st.mus=0;st.ug=0;st.ugo=[];st.ex=0;st.exo=[0];st.rs=(st.rs||0)+1;st.v=7;save();delete b.dataset.s;menu()}
const SK=[{n:'Standaard',d:'Helm, spijkerbroek en jas.',p:'#2b4a7a',j:'#3a3a3a',g:'#222',h:'#e8e8e8'},
{n:'Boef',t:1,d:'Gestreept boevenpak, masker, muts en een buitzak.',p:'#222',j:'#fff',g:'#222',f:'#f2c9a0'},
{n:'Donald Trump',t:2,d:'Donkerblauw pak, rode stropdas en blond kapsel.',p:'#1a237e',j:'#1a237e',g:'#f2b27c',f:'#f2b27c'},
{n:'Brian Brobbey',t:3,d:'Voetballer in rood-wit shirt (Nederlandse spits).',p:'#fff',j:'#d32f2f',g:'#d32f2f',f:'#8d5a3b'},
{n:'Paard',t:4,d:'Een paard op een scooter. Hihihi!',p:'#7b4a22',j:'#7b4a22',g:'#7b4a22'},
{n:'Koe',t:5,d:'Zwart-witte koe met hoorntjes en roze neus.',p:'#fff',j:'#f5f5f5',g:'#f5f5f5'},
{n:'Tante',t:6,d:'Vrolijke tante met bloemenjurk, hoed en handtas.',p:'#e91e63',j:'#e91e63',g:'#f5cba7',f:'#f5cba7'},
{n:'Nederlandse speler',t:7,d:'Blonde jongen in oranje shirt.',p:'#fff',j:'#ff6f00',g:'#f2c9a0',f:'#f2c9a0'},
{n:'Kameleon',t:8,d:'Verandert steeds van kleur.',p:'#66bb6a',j:'#66bb6a',g:'#66bb6a'},
{n:'Kikker',t:9,d:'Groene kikker met bolle ogen.',p:'#388e3c',j:'#4caf50',g:'#4caf50'},
{n:'Michael Jackson',t:10,d:'Zwarte hoed en jas, witte sokken, glinsterende handschoen.',p:'#111',j:'#111',g:'#fff',f:'#d9a77c'},
{n:'Bas',t:11,d:'Oranje haar en een witte huidskleur.',p:'#3b5b8a',j:'#37474f',g:'#f7e1cf',f:'#f7e1cf'},
{n:'Jelle',t:12,d:'Krullend bruin haar naar voren.',p:'#2c3e50',j:'#1e88e5',g:'#f5cba7',f:'#f5cba7'}];
function skins(){g.run=false;$('pts3').textContent=st.pts;const ow=st.sk||[0],cu=st.skin||0;$('sl').innerHTML=SK.map((s,i)=>`<div class="card"><div class="sw" style="background:${s.j}"></div><div class="i"><b>${s.n}</b><br><small>${s.d}</small></div>`+(ow.includes(i)?`<button onclick="pickSkin(${i})" ${cu==i?'disabled':''}>${cu==i?'Gekozen':'Kies'}</button>`:`<button onclick="buySkin(${i})" ${st.pts<200?'disabled':''}>200 pt</button>`)+'</div>').join('');show('skins')}
function buySkin(i){if(st.pts>=200){st.pts-=200;st.sk=(st.sk||[0]).concat(i);st.skin=i;save();skins()}}
function pickSkin(i){st.skin=i;save();skins()}
function pick(i){st.sel=i;save();shop()}
let g={run:false},keys={},tgt=null,bst=0;

// Toetsinvoer & Glitch tracking (3x spatie, daarna 3x wheelie)
addEventListener('keydown',e=>{
  const k=e.key.toLowerCase();
  if(!keys[k]&&g.run){
    if(k==' '){
      if(g.glSeq<3)g.glSeq++;else if(g.glSeq<6)g.glSeq=1;
    }else if(k=='e'||k=='shift'){
      if(g.glSeq>=3&&g.glSeq<6){
        g.glSeq++;
        if(g.glSeq===6)g.godMode=true;
      }else if(g.glSeq<3){
        g.glSeq=0;
      }
    }else if(k.startsWith('arrow')||k=='w'||k=='s'||k=='a'||k=='d'){
      // sturen verbreekt de sequentie niet
    }else{
      g.glSeq=0;
    }
  }
  keys[k]=1;
  if(g.run&&!(e.target&&/^(INPUT|TEXTAREA)$/.test(e.target.tagName))&&(k.startsWith('arrow')||k==' '||k=='e'))e.preventDefault();
  if(g.run&&!g.wh&&!e.repeat){
    if(k=='arrowup'||k=='w')g.ln=Math.max(0,g.ln-1);
    if(k=='arrowdown'||k=='s')g.ln=Math.min(3,g.ln+1);
  }
});
addEventListener('keyup',e=>delete keys[e.key.toLowerCase()]);
function pp(e){const r=cv.getBoundingClientRect();tgt={x:(e.clientX-r.left)*W/r.width,y:(e.clientY-r.top)*H/r.height}}
cv.onpointerdown=e=>{pp(e);cv.setPointerCapture(e.pointerId)};cv.onpointermove=e=>{if(e.buttons)pp(e)};cv.onpointerup=()=>tgt=null;
let wst=0;
let lb={};try{lb=JSON.parse(localStorage.getItem('sa_lb'))||{}}catch(e){}
function savelb(){try{localStorage.setItem('sa_lb',JSON.stringify(lb))}catch(e){}}
const vol=()=>st.vol==null?.6:st.vol;
function nm(){return(st.name||'').trim().slice(0,12)||'Speler'}
function rows(live){const m=Object.assign({},lb),n=nm();if(live!=null)m[n]=live;else if((st.name||'').trim()&&!(n in m))m[n]=0;return Object.entries(m).sort((a,b)=>b[1]-a[1])}
function rlb(){const r=rows(),el=$('lbm'),me=(st.name||'').trim()?nm():null;el.innerHTML='';
r.slice(0,10).forEach((e,i)=>{const d=document.createElement('div');d.className='lr'+(e[0]==me?' me':'');d.textContent=`${i+1}. ${e[0]} — ${e[1]}`;el.appendChild(d)});if(!r.length)el.textContent='Nog geen scores.'}
function setName(v){st.name=v.slice(0,12);save();rlb()}
const VG=()=>vol()*vol()*.9;
function setvol(v){st.vol=v/100;save();document.querySelectorAll('.vs').forEach(e=>e.value=v);if(mg)mg.gain.setTargetAtTime(VG(),ac.currentTime,.02);if(g.run&&!g.pause)vol()>0?musicOn():musicOff()}
function blip(){if(vol()<=0)return;try{ensureAudio();tone(ac.currentTime,NF(76),.2,'triangle',.4)}catch(e){}}
function music(){g.run=false;musicOff();mrender()}
function mrender(){$('pts4').textContent=st.pts;const ow=st.ms||[0],cu=st.mus||0;
$('ml').innerHTML=MS.map((m,i)=>`<div class="card"><div class="i"><b>${m.n}</b><br><small>${m.d}</small></div><button class="g" onclick="prev(${i})">${pvs===i?'⏹':'▶'}</button>`+(ow.includes(i)?`<button onclick="pickMus(${i})" ${cu==i?'disabled':''}>${cu==i?'Gekozen':'Kies'}</button>`:`<button onclick="buyMus(${i})" ${st.pts<200?'disabled':''}>200 pt</button>`)+'</div>').join('');show('music')}
function prev(i){const was=pvs===i;musicOff();if(!was){pvs=i;musicOn();if(!mtm){pvs=null;mrender();$('pts4').textContent=st.pts+' (zet het geluid aan om te luisteren)';return}ptm=setTimeout(()=>{ptm=null;if(pvs===i){musicOff();if(!$('music').classList.contains('hide'))mrender()}},8000)}mrender()}
function pickMus(i){st.mus=i;save();musicOff();mrender()}
function buyMus(i){if(st.pts>=200){st.pts-=200;st.ms=(st.ms||[0]).concat(i);st.mus=i;save();musicOff();mrender()}}
function fresh(){const b=$('fresh');if(!b.dataset.s){b.dataset.s=1;b.classList.add('w');b.textContent='⚠ Echt ALLES weg (ook resets)! Klik nogmaals';setTimeout(()=>{delete b.dataset.s;b.classList.remove('w');b.textContent='🗑 Helemaal opnieuw'},4000);return}
const keep={name:st.name,vol:st.vol,evol:st.evol};st={pts:0,own:[0],sel:0,v:7,sk:[0],skin:0,ms:[0],mus:0,ug:0,ugo:[],ex:0,exo:[0],rs:0,codes:[],hist:[]};if(keep.name!=null)st.name=keep.name;if(keep.vol!=null)st.vol=keep.vol;if(keep.evol!=null)st.evol=keep.evol;
lb={};savelb();save();delete b.dataset.s;b.classList.remove('w');b.textContent='🗑 Helemaal opnieuw';menu()}
const UG=[{n:'Rood',c:'#ff1744',p:400},{n:'Wit',c:'#ffffff',p:400},{n:'Blauw',c:'#2979ff',p:400},{n:'Geel',c:'#ffea00',p:400},{n:'Roze',c:'#ff4fd8',p:400},{n:'Regenboog',c:'linear-gradient(90deg,#f00,#ff0,#0f0,#0ff,#00f,#f0f)',p:2000,rb:1}];
function glows(){g.run=false;$('pts5').textContent=st.pts;const ow=st.ugo||[],cu=st.ug||0;
$('gl').innerHTML=`<div class="card"><div class="sw" style="background:#555"></div><div class="i"><b>Uit</b><br><small>Geen underglow.</small></div><button onclick="pickGlow(0)" ${cu==0?'disabled':''}>${cu==0?'Gekozen':'Kies'}</button></div>`+UG.map((u,i)=>{const n=i+1;return `<div class="card"><div class="sw" style="background:${u.c};box-shadow:0 0 10px ${u.rb?'#fff':u.c}"></div><div class="i"><b>${u.n}</b><br><small>Gloed onder je voertuig.</small></div>`+(ow.includes(n)?`<button onclick="pickGlow(${n})" ${cu==n?'disabled':''}>${cu==n?'Gekozen':'Kies'}</button>`:`<button onclick="buyGlow(${n})" ${st.pts<u.p?'disabled':''}>${u.p} pt</button>`)+'</div>'}).join('');show('glow')}
function pickGlow(n){st.ug=n;save();glows()}
function buyGlow(n){const u=UG[n-1];if(st.pts>=u.p){st.pts-=u.p;st.ugo=(st.ugo||[]).concat(n);st.ug=n;save();glows()}}
function glowFx(){const n=st.ug||0;if(!n)return;const u=UG[n-1],pul=.85+Math.sin(g.f*.15)*.15;x.save();x.scale(1,.22);

function step(){
  const sp=S[st.sel].s,ss=SC(g.y),T=(pe=>[pe.x,pe.y])(pends(st.sel)[0]),maxBo=S[st.sel].b;
  g.pf++;if(g.pf%(g.boost?1:3)==0)g.pa.push({x:g.x+T[0]*ss,y:g.y+T[1]*ss,vx:-(2.2+sp*0.25+Math.random()*1.2)-(g.boost?4.0:0),vy:-.3-Math.random()*.3,r:3,a:.9,c:g.boost?'60,60,60':'190,190,190'});
  for(const p of g.pa){p.x+=p.vx;p.y+=p.vy;p.r+=.2;p.a-=.025}
  g.pa=g.pa.filter(p=>p.a>0);
  if(g.ban>0){g.ban--;g.off+=sp*1.6+2;return}

  // Boost lockout tot 25% na leeggaan
  if(g.boLock){
    if(g.bo>=maxBo*0.25)g.boLock=false;
  }
  const wantBo=!!(bst||keys[' ']||keys.b);
  const bo=!g.boLock&&wantBo&&g.bo>0;
  g.boost=bo;

  if(bo){
    g.bo=Math.max(0,g.bo-1/60);
    if(g.bo<=0)g.boLock=true;
  }else{
    // 50% tragere regeneratie (0.125 i.p.v. 0.25 per sec)
    g.bo=Math.min(maxBo,g.bo+(1/60)*0.125);
  }

  g.wh=!!(wst||keys.shift||keys.e);g.wa+=((g.wh?1:0)-g.wa)*.15;g.mul=(bo?2:1)*(g.wh?1.5:1);
  g.off+=(sp*1.6+2)*(bo?1.6:1);g.t+=1/60;g.f++;g.earn+=(1+g.lvl)*2/60*g.mul;

  const baseKmMap={zip:45,koets:48,jog:54,booster:64,onewheel:75,estep:86,aerox:100,crosser:118,rocket:136,porsche:152,straaljager:170,maiskolf:75};
  const targetKmh=(g.ban>0?30:(baseKmMap[S[st.sel].id]||70))*(bo?1.45:1)*(g.wh?1.1:1);
  g.spd=(g.spd||0)+(targetKmh-(g.spd||0))*0.06;

  let dx=0;
  if(tgt){
    let b=0,bd=1e9;
    for(let i=0;i<4;i++){const d=Math.abs(LY(i)-tgt.y);if(d<bd){bd=d;b=i}}
    if(!g.wh)g.ln=b;
    const a=tgt.x-g.x;
    if(Math.abs(a)>25){dx=a>0?0.6:-1.0}
  }else{
    const r=keys.arrowright||keys.d?1:0,l=keys.arrowleft||keys.a?1:0;
    if(r)dx=0.65;else if(l)dx=-1.0;
  }

  g.fwd=dx>0;
  if(dx>0){
    g.x=Math.min(W-80,g.x+dx*2.4);
  }else if(dx<0){
    g.x=Math.max(100,g.x+dx*3.2);
  }else if(!tgt){
    if(g.x>270)g.x-=0.35;else if(g.x<250)g.x+=0.35;
  }

  const ty=LY(g.ln);g.y+=Math.max(-5,Math.min(5,ty-g.y));g.lean=(ty-g.y)*.006;
  const max=g.lvl==0?2+(g.t>15?1:0):3,every=Math.floor(Math.max(48,88-g.t*.8-g.lvl*10));
  if(g.f%every==every-1&&g.en.filter(e=>!e.mode).length<max){let ln=-1;for(let k=0;k<8;k++){const c=Math.random()<.45?g.ln:Math.floor(Math.random()*4);if(!g.en.some(e=>e.ln==c)){ln=c;break}}
  if(ln>=0){const big=Math.random()<.55,van=g.lvl==0&&big&&Math.random()<.4;g.en.push({x:-80,ln,y:LY(ln),big,van,gap:55+Math.random()*30,life:150+Math.random()*150,fate:Math.random()<.5?'crash':'pass',v:L[g.lvl].e*(big?.9:1.3)+(sp*0.16),hw:g.lvl==2?(big?34:24):van?54:g.lvl==4?(big?50:38):(big?44:32)})}}
  for(const e of g.en){e.age=(e.age||0)+1;const bx=bo?3.8:0;
  if(!e.mode){const near=Math.abs(e.x-g.x)<e.hw+110;if(e.ln==g.ln&&near)e.th=1;
  if((e.th&&e.ln!=g.ln&&near)||(e.ln!=g.ln&&e.age>e.life)){e.mode='back';e.bk=0;e.bkn=35+Math.random()*30;const r=Math.random();e.fate=r<.12?'crash':r<.62?'verge':'drop'}}
  if(e.mode=='crash'){e.cr++;e.x+=Math.max(-3,1.5-e.cr*.08)-bx;if(e.cr%4==0)g.pa.push({x:e.x,y:e.y-20,vx:-1-Math.random(),vy:-.8-Math.random(),r:4,a:.9,c:'70,70,70'});continue}
  if(e.mode=='verge'){e.cr++;e.y+=((e.ln<=1?HZ-1:H)-e.y)*.05;e.x-=Math.min(5,1.5+e.cr*.06)+bx;if(e.cr%3==0)g.pa.push({x:e.x+20,y:e.y-2,vx:-2-Math.random()*2,vy:-.4-Math.random()*.6,r:3,a:.8,c:'150,120,80'});continue}
  if(e.mode=='drop'){e.cr=(e.cr||0)+1;e.x-=Math.min(4,2+e.cr*.03)+bx;continue}
  if(e.mode=='back'){e.bk++;e.x-=1.5+Math.min(e.bk,30)*.08+bx;if(e.bk>e.bkn){e.mode=e.fate;e.cr=0}}
  else{const tx=g.x-(e.ln==g.ln?0:e.gap);e.x+=(e.x<tx?Math.min(e.v,tx-e.x):(tx-e.x)*.1)-bx}
  if(Math.abs(e.y-g.y)<12&&Math.abs(e.x-g.x)<e.hw*.8){if(!g.godMode){end(false);return}}}
  if(g.lvl==0){let h=g.hc;if(!h&&(g.hw=(g.hw||0)+1)>(g.hn?420:200)){h=g.hc={x:-120,y:0,lit:0,age:0,life:700+Math.random()*400};g.hn=1}
  if(h){h.age++;if(h.age<h.life){h.x+=Math.max(-2.8,Math.min(2.8,g.x-70+Math.sin(g.f*.03)*60-h.x));
  if(Math.abs(h.x+55-g.x)<42)h.lit++;else h.lit=Math.max(0,h.lit-3);if(h.lit>150){if(!g.godMode){end(false,'🚁 Gepakt door de politiehelikopter!');return}}}
  else{h.x+=3.2;h.y-=1.5;h.lit=Math.max(0,h.lit-3);if(h.x>W+150||h.y<-160){g.hc=null;g.hw=0}}}}
  g.en=g.en.filter(e=>e.x>-250&&!(e.cr>(e.mode=='verge'?110:75)));
  if(--g.tt<=0){g.tt=Math.floor(75+Math.random()*60-g.lvl*10);const busy=g.tr.filter(t=>t.x>W-160).map(t=>t.ln);if(busy.length<2){let ln;do{ln=Math.floor(Math.random()*4)}while(busy.includes(ln));const tp=Math.random()<.2?2:Math.random()<.3?1:0;g.tr.push({x:W+80,ln,y:LY(ln),v:(2.2+Math.random()*1.4),tp,hw:tp==2?46:tp==1?42:40,col:CC[Math.floor(Math.random()*CC.length)]})}}
  for(const t of g.tr){t.x-=(t.v+sp*0.5+(bo?3.8:0));if(Math.abs(t.y-g.y)<12&&Math.abs(t.x-g.x)<t.hw*.8){if(!g.godMode){end(false,'💥 Gebotst op een auto!');return}}}
  g.tr=g.tr.filter(t=>t.x>-120);
  if(g.t>=30){g.earn+=50;if(g.lvl<4){g.lvl++;g.t=0;g.f=0;g.en=[];g.tr=[];g.tt=60;g.ban=90;g.bo=S[st.sel].b}else end(true)}
}

function tone(t,f,d,ty,v){const o=ac.createOscillator(),q=ac.createGain();o.type=ty;o.frequency.value=f;q.gain.setValueAtTime(v,t);q.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(q);q.connect(mg);o.start(t);o.stop(t+d+.02)}

function kick(t){const o=ac.createOscillator(),q=ac.createGain();o.frequency.setValueAtTime(150,t);o.frequency.exponentialRampToValueAtTime(40,t+.12);q.gain.setValueAtTime(.5,t);q.gain.exponentialRampToValueAtTime(.001,t+.15);o.connect(q);q.connect(mg);o.start(t);o.stop(t+.17)}

if(i%2==0)tone(t,NF(c[0]+(i%4==2?12:0)),.13,'square',.09);
tone(t,NF(c[1][[0,1,2,1][i%4]]),.09,'triangle',.07);

function tecStep(s,t){const b=Math.floor(s/16)%4,i=s%16,r=[45,45,43,41][b];

function rockStep(s,t){const b=Math.floor(s/16)%4,i=s%16,r=[40,43,45,38][b];
